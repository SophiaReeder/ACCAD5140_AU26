<!-- INLINE JS (GOES INTO THE BODY)-->
<!-- NO LIMIT ON SCRIPT TAGS -->
<script>
// COMMENT
	
// variables
	// OLD - DO NOT USE
		//var myVar = "This is my variable";
		//var myInt = 89;
	
	// NEW - USE
	// if it changes, declare as let
	// if it won't change, declare as const
	let myVar_1 = "Hello";
	const myVar_2 = " World";
	let myVar_3 = myVar_1 + myVar_2;
	
	//capture output or return
		//alert(myVar_3);
	
	//showing what the code is doing
	console.log(myVar_1 + myVar_2);
	
// operators
	let result = 5 > 4;
	//alert(result);
	
	let num1 = 5;
	let num2 = 4;
	let numEval = num1 > num2;
	//alert(numEval);
	console.log(numEval);
	
	// conditional
		//only add () to else if you have something to put there
	let Var4 = 12;
	
	if (Var4 == 4) {
		console.log("Var4 == 4");
		} else {
		console.log("Var4 != 4");
	}
	
	// loop
		// for "as long as" something is true
		// defining a var, the value of the var (starting at 0)
		// as long as it's <=5, increment the var
	for (let i = 0; i<=5; i++) {
		console.log(i);
	}
	
	// array
	let color = ["red", "yellow", "green", "blue"];
	console.log("The color is " + color[1]);
	
	// function
	function addingNum() {
		let answer = (10 + 10);
		console.log("The answer is " + answer);
	}
	// call function
		//must call it for it to activate
	addingNum();
	
	
	// funtion
		// passing a parameter through function
	function addingNum2(x,y) {
		let answer2 = (x+y);
		console.log("The answer is " + answer2)
	}
	
	addingNum2(10,10);
	
	
	// task list application
	let tasks = ["Finish homework", "Study for test", "Clean room", "Go to bed"];
	
	function showTasks() {
		console.log("My To-Do List:");
		
		for(let i = 0; i < tasks.length; i++) {
			console.log((i + 1) + ". " + tasks[i]);
		}
	}
	showTasks();
	
	// methods
		//pre-defined function able to be called
	
	//EXAMPLE 1
	const name = "Sophia";
	console.log(name.toUpperCase());
	
	//EXAMPLE 2
	const numbers = [1,2,3];
	numbers.push(4);
	console.log(numbers);
	
	//EXAMPLE 3
		//filter will automatically execute what's inside it
	const numbers2 = [1,2,3,4,5,6,7,8];
	const evens = numbers2.filter(
	
		function isEven(num) {
			return num % 2 === 0;
		} 
	);
	console.log(evens);
	
	
	// shortcuts
	// 1.
	function square(number) {
		return number * number;
	}
	console.log(square(5));
	
	// 2.
	const squareShort = number => number * number;
	console.log(squareShort(5));
	
	// 3. Template Literal
	const nameNew = "Sophia";
	const ageNew = 24;
	
	console.log("May name is " + nameNew + " and I am " + ageNew + " years old.");
	console.log(`My name is ${nameNew} and I am ${ageNew} years old.`);
	
	
	
	// classes
	class Car {
		constructor(name, year) {
			this.name = name;
			this.year = year;
		}
		age() {
			const date = new Date();
			return date.getFullYear() - this.year;
		}
	}
	
	function carAge() {
		const myCar = new Car("Ford", 2014);
		const myAge = "My car is " + myCar.age() + " years old.";
		console.log(myAge);
	}
	
	carAge();
	
	
	//Attaching js to html and css
	
	
	
	
	
	
</script>
