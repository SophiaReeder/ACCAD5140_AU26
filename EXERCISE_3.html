<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="Keywords" content="HTML, CSS, JavaScript, Image Resizer, Labeler">
    <meta name="Description" content="Exercise 3 - JavaScript Application">
    <meta name="author" content="Sophia Reeder">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Exercise 3_Sophia Reeder</title>

    <!-- BOOTSTRAP & CSS REFERENCES -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/Class3_firstCSSPage.css">
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <style>
        body {
            font-family: Segoe, "Segoe UI", "DejaVu Sans", "Trebuchet MS", Verdana, "sans-serif";
            min-height: 100vh;
            background-color: #9BC3D1;
            color: #000000;
        }
		
		h1 {
            text-align: center;
            font-weight: bold;
            color: #090B39;
            margin: 40px;
        }
		
		h4 {
            text-align: center;
            font-weight: bold;
            color: #5F638C;
        }
        
        .customCard {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
  
        .buttonImageSize {
            width: 100%;
			background-color: #323D9E;
            color: #FFFFFF;
			padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        
        .buttonLabel {
            background-color: #4E7AA8;
            color: #FFFFFF;
			padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .buttonReset {
            width: 100%;
			background-color: #A62A55;
            color: #FFFFFF;
			padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .imageContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 350px;
            background-color: #F8F9FA;
            border: 2px solid #5F638C;
            border-radius: 8px;
            padding: 12px;
        }
		
		.imageLabel {
            background-color: #4E7AA8;
            color: #FFFFFF;
            padding: 4px;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 12px;
            font-weight: bold;
        }
		
		.spacerDiv {
		height: 40px;
		}

        #imageCard {
            text-align: center;
            padding: 4px;
            width: 300px;
        }

        #targetImage {
            max-width: 100%;
            border-radius: 8px;
        }

        
    </style>    
</head>
    
<body>
    <div class="container">
        
        <!-- HEADER ROW -->
        <div class="row">
            <div class="col-12">
                <h1>IMAGE RESIZER &amp; LABELER</h1>
            </div>
        </div>

        <!-- CARD ROW -->
        <div class="row">
            <div class="col-12">
                <div class="customCard">
                    
                    <!-- IMAGE WIDTH -->
                    <div class="text-center">
                        <label class="form-label">
                            <h4>Current Image Width:</h4>
                            <span id="sizeDisplay">300px</span>
                        </label>
                    </div>

                    <!-- IMAGE -->
                    <div class="imageContainer mb-4" id="canvasStage">
                        <div id="imageCard">
                            <img id="targetImage" src="images/Leon.jpg" alt="It's Leon Kennedy">
                            <div id="labelContainer"></div>
                        </div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="row">
                        <div class="col-4">
                            <button class="buttonImageSize" onclick="imageSize(-50)">- 50px</button>
                        </div>
                        <div class="col-4">
                            <button class="buttonReset" onclick="resetImageSize()">RESET IMAGE</button>
                        </div>
                        <div class="col-4">
							<button class="buttonImageSize" onclick="imageSize(50)">+ 50px</button>
                        </div>
                    </div>
					
					<div class="spacerDiv">&nbsp;</div>

                    <!-- LABEL FORM -->
					<!-- event.preventDefault() stops page from automatically reloading when submitting form, so label stays on page -->
                    <form id="labelForm" onsubmit="event.preventDefault(); imageLabel();">
                        <div>
                            <label for="labelInput" class="col-form-label"><h4>Image Label:</h4></label>
                            <input type="text" id="labelInput" class="form-control" placeholder= "Ex: Leon Kennedy">
                        </div>
						
						<div class="spacerDiv">&nbsp;</div>
                        <button type="submit" class="buttonLabel">Add Label to Image</button>
						
                    </form>

                </div>
            </div>
        </div>

    </div>

    <!-- JS -->
    <script>
        //Starting image width: 300px
        let currentWidth = 300;

        //CLASS 1: Image size and label text
        class ImageConfig {
            constructor(width, labelText) {
                this.width = width;
                this.labelText = labelText;
            } //END OF CONSTRUCTOR
				
			//FUNCTION: Make everything typed uppercase
            getFormattedLabel() {
                return this.labelText.toUpperCase();
            } //END FUNCTION
        } //END OF CLASS


        //FUNCTION 1: Image resizing
		function imageSize(number) {
    	const imageCard = document.getElementById("imageCard");
    	const sizeDisplay = document.getElementById("sizeDisplay");

		let newWidth = currentWidth + number;

			//Min size
			if (newWidth < 100) {
				newWidth = 100;
				alert("NO STOP! Your image must stay between 150px and 550px!");
			} //END OF IF
			//Max size
			else if (newWidth > 600) {
				newWidth = 600;
				alert("NO STOP! Your image must stay between 150px and 550px!");
			} //END OF ELSE IF

		//Update width
		currentWidth = newWidth;
		imageCard.style.width = currentWidth + "px";
    	sizeDisplay.textContent = currentWidth + "px";
		} //END OF FUNCTION


        //FUNCTION 2: Label on image
		function imageLabel() {
    		const labelInput = document.getElementById("labelInput");
			const labelContainer = document.getElementById("labelContainer");

			const text = labelInput.value.trim();

    		//Error if there's no text typed into form
    		if (text === "") {
       			alert("You didn't write anything! - The label can't be empty");
    		} //END OF IF STATEMENT

    		//Clear previous text on label
    		labelContainer.innerHTML = "";

    		//Create new label
    		const label = document.createElement("div");
    		label.className = "imageLabel";
    		label.textContent = text.toUpperCase();

    		//Add label to page and clear textbox
    		labelContainer.appendChild(label);
    		labelInput.value = "";
		} //END OF FUNCTION
		

        //FUNCTION 3: Reset image size
        function resetImageSize() {
            const imageCard = document.getElementById("imageCard");
            const sizeDisplay = document.getElementById("sizeDisplay");
            const labelContainer = document.getElementById("labelContainer");

            currentWidth = 300;
            imageCard.style.width = "300px";
            sizeDisplay.textContent = "300px";

            labelContainer.innerHTML = "";
        } //END OF FUNCTION
    </script>
</body>
</html>
