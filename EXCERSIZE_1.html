<script>
	//function that uses variables and operators for assignment or comparison
	//Should print in console as TRUE
	function checkNumTrue() {
            let myNumTrue = 15;
            let ten = 10;
            let resultA;

            if (myNumTrue > ten) {
                resultA = "TRUE: " + myNumTrue + " is greater than " + ten + "!";
            } else {
                resultA = "FALSE: " + myNumTrue + " is not greater than " + ten + ".";
            }
            console.log(resultA);
        }
	checkNumTrue();
	//Should print in console as FALSE
	function checkNumFalse() {
            let myNumFalse = 15;
            let twentyfive = 25;
            let resultB;

            if (myNumFalse > twentyfive) {
                resultB = "TRUE: " + myNumFalse + " is greater than " + twentyfive + "!";
            } else {
                resultB = "FALSE: " + myNumFalse + " is not greater than " + twentyfive + ".";
            }
            console.log(resultB);
        }
	checkNumFalse();
	
	
	//function that uses control structures (conditionals, loops, arrays, etc.)
	//should produce all words in array timeRhymes
	let timeRhymes = ["Crime", "Prime", "Climb", "Lime", "Dime", "Mime", "Bedtime", "Daytime", "Paradigm", "Thyme", "Grime"];
	
	function silly() {
		 for(let i = 0; i < timeRhymes.length; i++) {
			console.log((i + 1) + ". " + timeRhymes[i]);
		}
            
        }
	silly();
	
	
	//function that does anything else
	//class to be called in function
	class VideoGame {
            constructor(title, genre, releaseYear) {
                this.title = title;
                this.genre = genre;
                this.releaseYear = releaseYear;
            }
            //game details
            details() {
                let currentYear = 2026;
                let age = currentYear - this.releaseYear;
                return this.title + " is a " + this.genre + " game released " + age + " years ago.";
            }
        }
	//what will actually print
	function minecraft() {
            let favoriteGame = new VideoGame("Minecraft", "Sandbox", 2011);
            
            let gameInfo = favoriteGame.details();

            console.log(gameInfo);
        }
	minecraft();
	
	
	
</script>
