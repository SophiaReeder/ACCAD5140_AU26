<script>
	//function that uses variables and operators for assignment or comparison
	function checkNum() {
            let myNumber = 15;
            let threshold = 10;
            let result;

            if (myNumber > threshold) {
                result = "TRUE: " + myNumber + " is greater than " + threshold + "!";
            } else {
                result = "FALSE: " + myNumber + " is not greater than " + threshold + ".";
            }
            console.log(result);
        }
	checkNum();
	
	
	
	//function that uses control structures (conditionals, loops, arrays, etc.)
	 function yummyFruits() {
            let fruits = ["Apple, ", "Raspberries, ", "Blueberrues, ", "Mango, ", "Pinapple, ", "and Watermelon."];
            let outputText = "Fruits: ";

            for (let i = 0; i < fruits.length; i++) {
                outputText += fruits[i] + " ";
            }
            console.log(outputText);
        }
	yummyFruits();
	
	
	//function that does anything else
	//practice classes
	class VideoGame {
            constructor(title, genre, releaseYear) {
                this.title = title;
                this.genre = genre;
                this.releaseYear = releaseYear;
            }

            // A method within the class to calculate game details
            getSummary() {
                let currentYear = 2026;
                let age = currentYear - this.releaseYear;
                return this.title + " is a " + this.genre + " game released " + age + " years ago.";
            }
        }
	
	function showGameDetails() {
            let favoriteGame = new VideoGame("Minecraft", "Sandbox", 2011);
            
            let gameInfo = favoriteGame.getSummary();

            console.log(gameInfo);
        }
	showGameDetails();
	
	
	
</script>
