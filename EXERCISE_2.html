<!doctype html>
<html>
<head>
	
<!-- META INFO HERE -->
<meta charset="utf-8">
<meta name="Keywords" content="HTML, CSS, Javascript">
<meta name="Description" content="This is the page description!">
<meta name="author" content="Sophia">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
<title>Exercise 2 - Sophia Reeder</title>

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/grid.css">
<link rel="stylesheet" href="css/bootstrap-grid.css.map">
<!-- CSS File which will be referenced in -->
<link rel="stylesheet" href="css/Class3_firstCSSPage.css">
<script src="js/bootstrap.bundle.min.js"></script>
	
<style>
	
	h1 {
		text-align: center;
		
	}
		
	body {
		font-family: Arial, sans-serif;
		justify-content: center;
		align-items: center;
		min-height: 100vh;
		background-color: #E1CAF1;
		color: #000000;
		margin: 0;
		padding: 20px;
	}
	
	.spacerDiv {
		height: 40px;
	}
	
	.customCard {
		background-color: white;
		padding: 30px;
		border-radius: 12px;
		align-content: center;
		text-align: center;
		width: 100%;
	}
	
	.darkMode {
		background-color: #222222;
		color: #FFFFFF;
	}

	.badgeOnline {
		background-color: #9C0E9E;
		color: white;
		padding: 5px 10px;
		border-radius: 12px;
		font-size: 12px;
		display: inline-block;
		margin-top: 10px;
	}
	
	button {
		padding: 10px 18px;
		margin: 5px;
		border: none;
		border-radius: 6px;
		cursor: pointer;
		font-weight: bold;
	}
	
	.buttonPrimaryCustom {
		background-color: #561E95;
		color: white;
		width: 100%;
	}
	
	.buttonSecondaryCustom {
		background-color: #561E95;
		color: white;
		width: 100%;
	}

	#outputBox {
		width: 320px;
		background: #FFFFFF;
		border: 1px solid #FFFFFF;
		padding: 15px;
		border-radius: 8px;
		margin-top: 15px;
		font-size: 14px;
	}
		
</style>	
	
	
<script>
	//Function for output stuff
	function output(value) {
		const logElement = document.getElementById("return-log");
		if (logElement) {
			logElement.textContent = value;
		}
	}

	//FUNCTION 1: Change CSS styling (background)
	//Use classList
		//classList.add (add a class)
		//classList.remove (remove a class)
		//classList.contains (check if element has class)
	function theme() {
		const card = document.getElementById("themeCard");
		if (card.classList.contains("darkMode")) {
			card.classList.remove("darkMode");
			card.style.border = "1px solid #FFFFFF";
		} else {
			card.classList.add("darkMode");
		}

		const themeMessage = "You toggled the theme!";
		console.log(themeMessage);
	}

	//FUNCTION 2: Replace an element
	//Use document.createElement
		//document.createElement for this will create a new tag for h2
	//Use parentNode (checks that there is a parent-child relationship and can replace children)
	function replaceGreeting() {
		const newGreeting = document.createElement("h2");
		newGreeting.id = "greetingText";
		newGreeting.textContent = "Welcome to a Page Where You Can Press Buttons!!";

		const existingGreeting = document.getElementById("greetingText");
		if (existingGreeting && existingGreeting.parentNode) {
			existingGreeting.parentNode.replaceChild(newGreeting, existingGreeting);
		}

		const replaceHeader = "You replaced the header!";
		console.log(replaceHeader);
	}

</script>	
</head>
	

<body>
	
	<!-- BOOTSTRAP GRID CONTAINER -->
	<div class="container">
		
		<!-- HEADER ROW -->
		<div class="row">
			<div class="col-12">
				<h1>EXERCISE 2</h1>
			</div>
		</div>
		
		<div class="spacerDiv">&nbsp;</div>

		<!-- 2-COLUMN MAIN CONTENT GRID -->
		<div class="row">
			
			<!-- COLUMN 1: BUTTONS TO PRESS -->
			<div class="col-3">
				<!-- REPLACE GREETING -->
				<!-- calling the function replaceGreeting when the button is clicked -->
					<button type="button" class="buttonPrimaryCustom" onClick="replaceGreeting()">Change Greeting Header</button>
			</div>
			<div class="col-3">
				<!-- TOGGLE CARD THEME -->
				<!-- calling the function theme when the button is clicked -->
					<button type="button" class="buttonSecondaryCustom" onClick="theme()">Toggle Card Theme</button>
			</div>
			<div class="col-3">
				<!-- CLASS BUTTON 1: UPDATE NAME -->
					<button id="updateNameButton" class="buttonPrimaryCustom">Random Name</button>
			</div>
			<div class="col-3">
				<!-- CLASS BUTTON 2: TOGGLE BADGE -->
					<button id="toggleBadgeButton" class="buttonSecondaryCustom">Toggle Badge</button>
				</div>
			</div>
		
		<div class="spacerDiv">&nbsp;</div>
		
		<div class="row">
			<!-- COLUMN 2: INTERACTIVE CARD -->
			<div class="col-12">
				<div id="themeCard" class="customCard">
					<h3 id="greetingText">What's Up?</h3>
					<p id="userNameDisplay">Names will appear when you click the 'Random Name' button!</p>
					<div id="badgeContainer"></div>
				</div>
			</div>
		</div>


	</div>


	<script>
		//CLASS: Change profile names with button press
		class ProfileCard {
			constructor() {
				this.nameElement = document.getElementById("userNameDisplay");
				this.badgeContainer = document.getElementById("badgeContainer");
				this.isOnline = false;
				this.names = ["Claire Redfield", "Leon Kennedy", "Ada Wong", "Ashley Grahm"];
				this.nameIndex = 0;
			}

			//Update names from array
				//looking at length of array "names" and doing some math
				//use % symbol (returns the remainder left over after dividing)
				//names will loop when divided by 4 ((3+1) / 4) = 0 remainder
			updateName() {
				this.nameIndex = (this.nameIndex + 1) % 4;
				this.nameElement.textContent = this.names[this.nameIndex];

				console.log("Name changed to " + this.names[this.nameIndex]);
			}

			//Adds/Remove elements using createElement & removeChild
				// ! reverses meaning (goes from true to false)
			toggleStatus() {
				this.isOnline = !this.isOnline;

				if (this.isOnline) {
					const badge = document.createElement("span");
					badge.id = "statusBadge";
					badge.className = "badgeOnline";
					badge.textContent = "Active Now";
					this.badgeContainer.appendChild(badge);
				} else {
					const existingBadge = document.getElementById("statusBadge");
					if (existingBadge) {
						this.badgeContainer.removeChild(existingBadge);
					}
				}

				console.log("You toggled the badge!");
			}
		}

		//Change on webpage 
		const myProfile = new ProfileCard();
		//need function () in lines in order to wait for on click to run functions updateName or toggleStatus
		document.getElementById("updateNameButton").addEventListener("click", function() {
			myProfile.updateName();
		});

		document.getElementById("toggleBadgeButton").addEventListener("click", function() {
			myProfile.toggleStatus();
		});
	</script>
	
</body>
	
</html>
